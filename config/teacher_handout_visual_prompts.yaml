        "uncertain_spans": [],
        "format_fix_log": [
          {"field":"stem|answer|analysis|handwriting","before":"...","after":"...","reason":"markdown_latex_standardize|layout_restore|operator_fix","confidence":0.0}
        ],
        "unresolved_format_spans": [
          {"field":"stem|answer|analysis|handwriting","text":"...","reason":"still_ambiguous"}
        ]
      }
  refine:
    prompt_version: "local_refine_v0.1"
    user_template: |
      You are a K12 math visual refinement assistant.
      Task: review only the risky spans listed below against the provided images and correct them if the image evidence clearly supports a correction.
      Keep all other text unchanged. Do not rewrite for style. Do not summarize. Do not expand "如图" into a natural-language picture description.
      If the image is cropped or unclear, keep the current text and add an unresolved span instead of guessing.
      Return JSON only.

      Rules:
      1. Only change text when the image evidence is clear.
      2. Preserve existing field boundaries: stem_text_md / answer_text_md / analysis_text_md.
      3. Preserve Markdown + LaTeX. Use $...$ and $$...$$ only.
      4. Never drop visible object labels such as A, B, C, D, E, F, G, M, N, P, Q, point names, line names, or angle labels.
      5. If no correction is needed, return the original fields unchanged and an empty refine_log.
      6. If you change a span, log it in refine_log with field, span_before, span_after, reason, evidence_ref_key, and confidence.
      7. If a listed span remains unclear, record it in unresolved_spans.

      record_id: {{RECORD_ID}}
      question_id: {{QUESTION_ID}}

      Current fields:
      stem_text_md = {{STEM_TEXT_JSON}}
      answer_text_md = {{ANSWER_TEXT_JSON}}
      analysis_text_md = {{ANALYSIS_TEXT_JSON}}

      Risk spans to inspect:
      {{RISK_SPANS_BLOCK}}

      Output schema:
      {
        "record_id": "...",
        "question_id": "...",
        "stem_text_md": "...",
        "answer_text_md": "...",
        "analysis_text_md": "...",
        "stem_requires_image": true,
        "analysis_requires_image": true,
        "uncertain_spans": [],
        "refine_log": [
          {"field":"stem|answer|analysis","span_before":"...","span_after":"...","reason":"local_reread","evidence_ref_key":"question_image|stem_image|analysis_image","confidence":0.0}
        ],
        "unresolved_spans": [
          {"field":"stem|answer|analysis","text":"...","reason":"unclear_after_reread"}
        ]
      }
  option_anchor:
    prompt_version: "option_anchor_v1.2"
    system_prompt: |
      You analyze Chinese K12 math question layout from images.
      You only do visual structure analysis and must return strict JSON.
      Do not solve the question. Do not transcribe full fields. Do not add commentary.
    user_template: |
      Task: detect multiple-choice option anchors and image ownership inside one question image.

      Goal:
      1. Detect the stem region.
      2. Detect option anchors A/B/C/D when they exist.
      3. Detect each option's full visual region.
      4. Detect image regions inside each option.
      5. Detect public stem images that belong to the question stem, not to a single option.
      6. Detect image regions that cannot be assigned confidently.
      7. Distinguish true figure objects from text strips, formula strips, and decorative text.

      Coordinate rules:
      1. Do not output real pixel coordinates.
      2. Treat the whole input image as a normalized 1000 x 1000 canvas.
      3. Top-left is (0, 0), bottom-right is (1000, 1000).
      4. In the output, image_width must be 1000 and image_height must be 1000.
      5. All x, y, w, h values must use this normalized 0-1000 coordinate system.

      Rules:
      1. Return strict JSON only.
      2. Use normalized coordinates with keys x, y, w, h.
      3. Use bbox_space={{BBOX_SPACE}} for all option and stem image boxes unless the image clearly belongs to another provided crop.
      4. If an option contains only text, image_bboxes must be an empty array.
      5. If an image belongs to the public stem instead of a single option, put it into stem_image_bboxes.
      6. If an image cannot be assigned confidently, put it into unassigned_image_bboxes.
      7. If confidence is below 0.75, add review_flags such as option_anchor_low_confidence or cross_option_image_detected.
      8. Do not include analysis-region images inside option image_bboxes.
      9. If no reliable options are visible, return an empty options array and put option_anchor_missing in global_review_flags.
      10. A true image region means a self-contained visual object such as a coordinate graph, geometry diagram, shaded construction figure, table, or chart. It is not just any non-text patch.
      11. Do not mark these as images: a short formula line, a title strip, a red explanation line, a page number, a figure caption line, an option label, or a thin horizontal text band.
      12. If a region is mostly text with only a tiny symbol, arrow, or underline, do not return it as an image bbox.
      13. Return tight boxes around the graphical object itself. Do not swallow nearby paragraphs, question sentences, or large blank margins.
      14. If one figure contains axes, curves, point labels, or geometric point names, keep them together in one box.
      15. If multiple figures are clearly separate, such as 图1 / 图2 / 图3 or several side-by-side diagrams, return separate boxes instead of one merged box.
      16. If you are unsure whether a region is a true figure or only stylized text, prefer not to return that box.

      Optional noisy text hint:
      {{HINT_TEXT}}

      Output schema:
      {
        "image_width": 0,
        "image_height": 0,
        "stem_bbox": {"x": 0, "y": 0, "w": 0, "h": 0},
        "options": [
          {
            "option_key": "A",
            "option_order": 1,
            "label_bbox": {"x": 0, "y": 0, "w": 0, "h": 0},
            "option_bbox": {"x": 0, "y": 0, "w": 0, "h": 0},
            "text_bbox": {"x": 0, "y": 0, "w": 0, "h": 0},
            "image_bboxes": [],
            "layout_type": "vertical|horizontal|two_column|unknown",
            "confidence": 0.0,
            "review_flags": []
          }
        ],
        "stem_image_bboxes": [],
        "unassigned_image_bboxes": [],
        "global_review_flags": []
      }
  inline_figure:
    prompt_version: "inline_figure_cn_grounding1000_v1.5"
    system_prompt: |
      你只做一件事：从一张中文数学题图片中找出需要单独保存的图形资产本体。
      只返回严格 JSON，不解题，不转录文字，不解释。
    user_template: |
      任务：找出图片中的“图形资产本体”，并给出每张图的 bbox。

      图片类型：{{BBOX_SPACE}}
      原图真实尺寸：width={{IMAGE_WIDTH}}, height={{IMAGE_HEIGHT}}

      坐标要求：
      1. 不要输出原图像素坐标。
      2. 请把整张图片看成一个 1000 × 1000 的归一化坐标画布。
      3. 左上角是 (0, 0)，右下角是 (1000, 1000)。
      4. 输出里的 image_width 必须是 1000，image_height 必须是 1000。
      5. x、y、w、h 全部使用这个 0-1000 坐标系。

      什么算图形资产本体：
      - 函数图像、坐标系、几何图、立体图、统计图、表格、示意图。
      - 图内部或紧贴图形的 x、y、O、A、B、C、D、点名、坐标轴箭头、曲线端点、几何顶点，都属于图形资产，必须保留。

      什么不属于图形资产：
      - 选项编号 A. B. C. D. 只是定位锚点，不能框进去。
      - 题干文字、解析文字、红色讲解文字、公式行、页眉页脚、标题条，不能框进去。

      框选原则：
      1. 每个独立图形资产输出一个 bbox。
      2. bbox 只框图形主体和图内必要标签，不要框整个选项区域。
      3. 先看黑/灰色图形线条主体，再包含图内标签，最后留少量安全边距。
      4. 不能裁掉坐标轴箭头、曲线端点、几何顶点、图内标签。
      5. 如果图形和外部文字距离很近，宁可略微裁紧，也不要吞入题干或解析文字。
      6. 如果无法干净分离但必须保证完整，在 review_flags 加 bbox_may_include_text。
      7. 如果疑似裁残，在 review_flags 加 bbox_may_clip_figure。

      Optional noisy text hint:
      {{HINT_TEXT}}

      Output schema:
      {
        "image_width": 1000,
        "image_height": 1000,
        "image_bboxes": [
          {
            "asset_id": "figure_001",
            "x": 0,
            "y": 0,
            "w": 0,
            "h": 0,
            "confidence": 0.0,
            "review_flags": []
          }
        ],
        "global_review_flags": []
      }
  public_figure_rescan:
    prompt_version: "public_figure_rescan_panelfirst_cn_grounding1000_v0.2"
    system_prompt: |
      你只做数学题题内图片的漏检复扫。
      输入是一整张题目截图，planner 已经判断指定区域存在题内图形，但前一轮检测漏掉了或切得不稳定。
      你只返回严格 JSON，不解题，不转录正文，不解释。
      默认策略是 panel-first：
      - 如果多个小图本来就是一个组合面板、步骤图组、图1/图2/图3 连续图、同一道大题里的并列辅助图，请优先保留为完整 panel。
      - 只有在天然独立、边界非常清楚、拆开后不会丢内容也不会重复时，才拆成多个 bbox。
      - 宁可略带少量空白，也不要切残、切碎、重复框同一组图。
    user_template: |
      target_scope: {{TARGET_SCOPE}}
      planner 判断的图形类型：{{IMAGE_PRESENCE}}

      任务：
      1. 只在与 {{TARGET_SCOPE}} 相关的区域寻找题内图形。
      2. 如果这是超长题图、长解析图、步骤图组、图1/图2/图3/图4、横向并列或纵向连续的小图集合，请优先输出完整 panel bbox。
      3. 如果图形本来就是一个组合区域，不要为了干净而拆碎成很多小框。
      4. 不要重复输出高度重叠、明显属于同一 panel 的 bbox。

      坐标要求：
      1. 把整张输入图看成 1000 x 1000 的归一化画布。
      2. 左上角是 (0,0)，右下角是 (1000,1000)。
      3. 输出 image_width=1000，image_height=1000。

      必须保留：
      - 函数图像、坐标轴、数轴、几何图、立体图、统计图、表格、辅助线、步骤图、图内点名/字母/数字标注。
      - 紧贴图形的 图1/图2/图3/图4、步骤编号、面板内必要标签。

      关键约束：
      - 不允许只框“图1/图2/图3/图4/备用图”等底部标签行；bbox 必须覆盖这些标签上方对应的图形本体。
      - 如果看到的是横向并列或纵向连续的小图面板，bbox 的上边界必须包含各小图主体，不能只贴着底部说明文字。
      - 如果一个候选框几乎横跨整行，但只落在底部标签/说明文字区域，这个框是错误的，不要输出。
      - 如果你不确定面板边界，宁可把上方图形整体多保留一点，也不要只返回下方标签带。

      必须排除：
      - 题干正文、解析正文、红色教师讲解文字、页眉页脚、题号、纯公式推导行。

      review_flags 约定：
      - 如果这是组合图整体保留，加入 "panel_kept"。
      - 如果 bbox 可能仍需人工确认，加入 "bbox_needs_review"。
      - 如果这是长图场景下的复扫结果，加入 "long_image_branch"。

      Output schema:
      {
        "image_width": 1000,
        "image_height": 1000,
        "image_bboxes": [
          {
            "asset_id": "figure_001",
            "x": 0,
            "y": 0,
            "w": 0,
            "h": 0,
            "confidence": 0.0,
            "review_flags": []
          }
        ],
        "global_review_flags": []
      }
  public_figure_route_review:
    prompt_version: "public_figure_route_review_cn_grounding1000_v0.1"
    system_prompt: |
      你只做数学题题内图片检测前的路由复核。
      输入是一整张题图。
      你的任务不是转录文字，也不是切很多小框，而是判断这张图更适合哪种检测策略。
      只返回严格 JSON。
    user_template: |
      target_scope: {{TARGET_SCOPE}}
      planner 判断的图形类型：{{IMAGE_PRESENCE}}
      source_field: {{SOURCE_FIELD}}
      same_long_source: {{SAME_LONG_SOURCE}}
      image_width: {{IMAGE_WIDTH}}
      image_height: {{IMAGE_HEIGHT}}

      任务：
      判断这张题图接下来更适合哪种策略：

      1. whole_panel_bbox
         适用于：
         - 题干里有一张公共配图，需要整体保留；
         - 图形本体本来就是一个整体面板；
         - 如果拆开会丢掉整体关系、坐标轴、数轴、并列圆/点/箭头、紧贴图形的标签。

      2. panel_long_branch
         适用于：
         - 真正的超长题图、长解析图、上下堆叠的多步骤图组；
         - 一张图里有多个纵向连续或分段出现的图组，直接整图检测容易漏掉上半部分或下半部分。

      3. normal_detection
         适用于：
         - 题图并不长；
         - 图形天然独立；
         - 不需要强行整块保留，也不需要长图分段。

      关键判断要求：
      - 如果这是一道短题，但 question_image / stem_image / analysis_image 只是碰巧共用同一张图，不要因此误判为 panel_long_branch。
      - 如果这是短题里的公共题干图，优先考虑 whole_panel_bbox。
      - 如果你选择 whole_panel_bbox，必须输出一个 panel_bbox，覆盖完整图形本体及图内必要标签。
      - 如果你选择 normal_detection 或 panel_long_branch，panel_bbox 置空即可。

      坐标要求：
      1. 把整张输入图看成 1000 x 1000 的归一化画布。
      2. 左上角是 (0,0)，右下角是 (1000,1000)。
      3. 如果输出 panel_bbox，坐标也用这个归一化坐标系。

      Output schema:
      {
        "route_mode": "whole_panel_bbox|panel_long_branch|normal_detection",
        "panel_bbox": {
          "x": 0,
          "y": 0,
          "w": 0,
          "h": 0
        },
        "confidence": 0.0,
        "review_flags": []
      }
  inline_figure_refine:
    prompt_version: "inline_figure_refine_single_candidate_cn_grounding1000_v0.3"
    system_prompt: |
      你只做“单个候选图形资产”的二次精切。
      输入已经是上游检测节点给出的一个候选裁片，不是整题图，也不是让你重新找图。
      只返回严格 JSON，不解题，不转录题目，不解释。
    user_template: |
      任务：只针对当前这一张候选裁片做边界精修。

      绝对禁止：
      - 不要在当前裁片里重新寻找多张图。
      - 不要输出多个 bbox。
      - 不要拆分图组、不要新增图、不要补找其他图。
      - 不要因为看到多个相似小图就选择其中一个；如果当前候选本来就是图组/panel，必须整体保留。
      - 不要把任务改成题目理解、公式转录或答案解析。

      坐标要求：
      1. 把当前候选裁片看成 1000 x 1000 的归一化画布。
      2. 左上角是 (0,0)，右下角是 (1000,1000)。
      3. 输出 image_width=1000，image_height=1000。
      4. bbox 只针对当前候选裁片，不是原始整题图。

      什么必须保留：
      - 坐标轴、箭头、曲线、几何线段、辅助线、点名、图内字母、图内坐标、图1/图2/图3/备用图这类紧贴图形的图注。
      - 特别注意：如果 A/B/C/D、x/y、P/Q/M/N 等字母是图内点名、端点标签、轴旁字母、图内标注，必须保留，不能因为贴边就裁掉。
      - 如果候选裁片是组合图、步骤图组、多个并列小图、平行四边形大图组，必须把整个当前候选作为一个整体保留，只可微调外边界。

      什么必须去掉：
      - 题干文字、解析文字、红色讲解文字、公式推导行、蓝色页眉、页码、空白边。
      - 只有当 A./B./C./D. 明确是图外行首的选项前缀、且与图形主体没有连接关系时，才可以不纳入 bbox。

      判断规则：
      1. 如果候选裁片主要是文字/公式/解析，不是图形，返回 is_valid_figure=false。
      2. 如果确实有图形，但边上混了文字，只在当前候选内部裁掉明显文字边，不改变候选对象数量。
      3. 宁可略宽一点，也不要为了贴紧而裁掉图形边缘点名、轴字母、图注标签。
      4. 不要裁掉坐标轴箭头、几何顶点、曲线端点、点名标签。
      5. 如果你无法确定某个 A/B/C/D 是选项前缀还是图内点名，默认按图内点名保留。
      6. 如果不确定边界是否能安全收缩，返回接近全图的 bbox，并在 review_flags 加 "single_candidate_keep_wide"。

      Output schema:
      {
        "image_width": 1000,
        "image_height": 1000,
        "is_valid_figure": true,
        "bbox": {"x": 0, "y": 0, "w": 0, "h": 0},
        "confidence": 0.0,
          "review_flags": []
        }

  option_figure_refine:
    prompt_version: "option_figure_refine_grounding1000_v0.1"
    system_prompt: |
      你只做数学选择题选项配图的定位。
      输入是一整张题目截图和一个目标选项字母。
      只返回该选项对应的图形本体 bbox，不解题，不转录文字，不输出多余内容。
    user_template: |
      目标选项：{{OPTION_KEY}}

      任务：
      在整张题图中找到目标选项 {{OPTION_KEY}} 对应的数学图形本体，并返回 bbox。

      坐标要求：
      1. 把整张输入图看成 1000 x 1000 的归一化画布。
      2. 左上角为 (0,0)，右下角为 (1000,1000)。
      3. 输出 image_width=1000，image_height=1000。

      必须保留：
      - 坐标轴、箭头、曲线、几何线段、点名、图内字母、图内数字、图内坐标。

      必须排除：
      - 题干文字、解析文字、红色答案/解析、页眉页脚。
      - 其他选项的图形。

      选项字母 A/B/C/D 本身可以不框入 bbox，因为系统会用 option_key 单独展示。
      如果目标选项图形无法可靠定位，返回 is_valid_figure=false。

      Output schema:
      {
        "image_width": 1000,
        "image_height": 1000,
        "is_valid_figure": true,
        "bbox": {"x": 0, "y": 0, "w": 0, "h": 0},
        "confidence": 0.0,
        "review_flags": []
      }

  visual_insert_anchor_review:
    prompt_version: "visual_insert_anchor_review_v0.3"
    system_prompt: |
      You review one Chinese K12 math question and several already-cropped figure assets.
      Your only task is to decide where each asset should be inserted back into the structured fields.
      Return strict JSON only.
      Do not solve the question.
      Do not rewrite the full text.
      Do not output markdown or commentary.
    user_template: |
      Task:
      Given:
      1. the full question image,
      2. the current stem / answer / analysis texts,
      3. several cropped figure assets with stable asset_id values,
      decide the best insertion anchor for each asset.

      Available fields:
      - stem
      - answer
      - analysis

      Rules:
      1. Use each asset_id exactly as provided.
      2. For each asset, choose exactly one target_field.
      3. If there is a reliable explicit slot such as 如图 / 图1 / 图2 / ① / （2）, you may use anchor_mode=after_anchor_slot and choose one exact anchor_slot_id.
      4. If the right location is more specific than the available slot roster, use anchor_mode=after_anchor_text and copy one exact visible anchor_text substring from the target field snapshot.
      5. Use field_tail only when neither a reliable anchor_slot_id nor a reliable exact anchor_text can be chosen.
      6. If multiple slots contain similar text like 如图 or 图1, do not guess by plain text alone. Prefer after_anchor_text when you need finer placement.
      7. For after_anchor_text, anchor_text must be an exact substring copied from the target field snapshot, not rewritten or paraphrased.
      8. Keep the asset order consistent with the visual reading order when multiple assets belong to the same field.
      9. If the current cropped asset obviously belongs to the stem panel, keep it in stem.
      10. If the current cropped asset obviously belongs to the answer / solution / proof steps, place it in answer or analysis accordingly.
      11. If you are unsure between answer and analysis, prefer analysis and add a review flag.

      Field text snapshot:
      STEM:
      {{STEM_TEXT}}

      ANSWER:
      {{ANSWER_TEXT}}

      ANALYSIS:
      {{ANALYSIS_TEXT}}

      Available anchor slots:
      {{ANCHOR_SLOTS}}

      Asset roster:
      {{ASSET_LINES}}

      Output schema:
      {
        "placements": [
          {
            "asset_id": "asset_001",
            "target_field": "stem|answer|analysis",
            "anchor_mode": "after_anchor_slot|after_anchor_text|field_tail",
            "anchor_slot_id": "",
            "anchor_text": "",
            "confidence": 0.0,
            "review_flags": []
          }
        ],
        "global_review_flags": []
      }

  visual_block_layout_review:
    prompt_version: "visual_block_layout_review_v0.1"
    system_prompt: |
      You are a conservative math question layout reviewer.
      Your only job is to order existing text segments and existing image assets into final display blocks.
      Never rewrite, summarize, translate, delete, or add math text.
      Use only the provided segment_id values and asset_id values.
    user_template: |
      Task:
      Build the final display block order for a long math question with multiple related figure assets.

      Safety rules:
      1. Every text segment listed below must appear exactly once.
      2. Every asset_id listed below must appear exactly once.
      3. Text segments must remain in their original order inside each field.
      4. Field order must remain stem, answer, analysis.
      5. Do not output text content. Output only segment_id and asset_id.
      6. Insert an image immediately after the text segment that introduces or uses that figure.
      7. If an asset belongs to a figure mentioned by "如图", "图1", "图2", or a local proof branch, place it after that local segment.
      8. If unsure, keep the nearest earlier segment in the same field and add a review flag.

      Text segments:
      {{TEXT_SEGMENTS}}

      Asset roster:
      {{ASSET_LINES}}

      Output schema:
      {
        "blocks": [
          {"block_type": "text", "segment_id": "stem_seg_001"},
          {"block_type": "image", "field": "stem|answer|analysis", "asset_id": "asset_001"}
        ],
        "global_review_flags": []
      }

  split_node_refine:
    prompt_version: "split_node_refine_single_failed_candidate_v0.1"
    system_prompt: |
      你是 TeachBase split_v03 的讲义切块精修节点。
      你只修复一个已经被上游标记为 NEEDS_REVIEW 的题目候选块。
      输入是一张局部页面带状图，不是整份讲义，也不是让你重新切全页。
      只返回严格 JSON，不转录题目，不解题，不输出多个候选。
    user_template: |
      任务：只针对当前失败题块做边界精修。

      当前候选：
      - node_id={{NODE_ID}}
      - doc_key={{DOC_KEY}}
      - page={{PAGE}}
      - failure_reasons={{FAILURE_REASONS}}
      - candidate_bbox_norm_in_current_image={{CANDIDATE_BBOX_NORM}}

      当前输入图说明：
      - 图片是当前失败题块附近的局部页面带状图。
      - 坐标统一使用当前输入图的 0-1000 归一化坐标。
      - candidate_bbox_norm_in_current_image 是上游候选框在当前图中的位置。

      只允许做：
      1. 如果候选吞入了下一题、下一节标题、知识点标题、强化训练标题，则缩小当前题块下边界。
      2. 如果候选过短，只包含题干而缺少同题的答案/解析/翻译/详解，则向下扩展到同题内容结束。
      3. 如果当前图中证据不足，返回 is_repaired=false，并给出 needs_manual_review。

      禁止：
      - 不要切分多个题。
      - 不要新增题。
      - 不要合并其它题。
      - 不要转录文字。
      - 不要把下一题题干、下一节标题、页眉、页脚、页码放进当前题块。

      判断边界：
      - 当前题块应包含题干、选项、答案、解析、翻译/详解、题内图表。
      - 当前题块应停止在下一个同级题号、下一节标题、知识讲解标题、强化训练/课后练习标题之前。
      - 如果是跨页尾题，图中只能修当前页可见部分，不脑补下一页。

      Output schema:
      {
        "is_repaired": true,
        "bbox": {"x": 0, "y": 0, "w": 0, "h": 0},
        "confidence": 0.0,
        "review_flags": [],
        "reason": ""
      }

  continuation_judge:
    prompt_version: "continuation_judge_pair_evidence_v0.1"
    system_prompt: |
      你是 TeachBase split_v03 的跨页/续片语义判断节点。
      你只判断候选片段 B 是否应该接到当前题尾 A 后面。
      不转录题目，不解题，不重新切整页，只返回严格 JSON。
    user_template: |
      任务：判断 B 是否是 A 的同一道题续片。

      元信息：
      - node_id={{NODE_ID}}
      - doc_key={{DOC_KEY}}
      - failure_reasons={{FAILURE_REASONS}}
      - candidate_block_id={{CANDIDATE_BLOCK_ID}}
      - candidate_flags={{CANDIDATE_FLAGS}}

      输入图说明：
      - 图中上半部分标记为 A：当前题尾/当前失败题块。
      - 图中下半部分标记为 B：候选续片。
      - B 可能来自当前题下方，也可能来自下一页顶部。

      判断标准：
      - 如果 B 明显继续 A 的同一题题干、选项、答案、解析、翻译、详解、证明、图表说明，则 attach。
      - 如果 B 是下一道题、新章节标题、知识讲解、强化训练标题、页眉页脚、纯页码，必须 reject。
      - 如果 B 可能相关但证据不够，比如只有半句、缺上下文、像另一个题的开头，则 manual_review。
      - 不要因为 A 缺答案解析就强行接 B；必须看到 B 和 A 的语义/版式连续性。

      Output schema:
      {
        "decision": "attach|reject|manual_review",
        "role": "body_continuation|answer_block|analysis_block|translation_block",
        "confidence": 0.0,
        "reason": "",
        "review_flags": []
      }

  ownership_conflict_judge:
    prompt_version: "ownership_conflict_three_way_judge_v0.1"
    system_prompt: |
      你是 TeachBase split_v03 的候选块归属冲突裁决节点。
      你只判断同一个候选片段 B 应该归属当前题 A，还是保留给原归属题 C。
      不裁图，不转录，不解题，不改写内容，只返回严格 JSON。
    user_template: |
      任务：裁决候选片段 B 的归属。

      元信息：
      - claimant_node_id={{CLAIMANT_NODE_ID}}
      - owner_node_id={{OWNER_NODE_ID}}
      - candidate_block_id={{CANDIDATE_BLOCK_ID}}
      - failure_reasons={{FAILURE_REASONS}}
      - continuation_decision={{CONTINUATION_DECISION}}
      - continuation_reason={{CONTINUATION_REASON}}

      输入图说明：
      - A：当前失败题的题尾或短题块。
      - B：候选片段，上一轮模型认为它可能是 A 的续片。
      - C：B 当前所属的题目节点证据。

      你要判断：
      1. 如果 B 明显是 A 的题干/选项/答案/解析/翻译/图表续片，且 C 看起来只是误建的无头题或重复壳，返回 move_to_claimant。
      2. 如果 B 明显是 C 的独立题目内容，返回 keep_original_owner。
      3. 如果 B 同时包含 A 的续片和 C 的新题开头，或者证据不足，返回 split_required。
      4. 如果无法可靠判断，返回 manual_review。

      安全要求：
      - 不要因为 A 缺答案解析就强行挪 B。
      - 如果 C 有清楚的新题号/新题干/独立选项，优先 keep_original_owner 或 split_required。
      - 如果 C 没有可见题号，且 B 语义明显承接 A，允许 move_to_claimant。
      - 只做归属裁决，不输出 bbox。

      Output schema:
      {
        "decision": "move_to_claimant|keep_original_owner|split_required|manual_review",
        "confidence": 0.0,
        "reason": "",
        "review_flags": []
      }

  analysis_figure_rescan:
    prompt_version: "analysis_figure_rescan_grounding1000_v0.1"
    system_prompt: |
      你只做数学题解析区配图的漏检复扫。
      输入是一整张题目截图，planner 已经判断解析/解答区域存在图形。
      只返回解析/答案/解答/证明区域中需要单独保存的图形 bbox。
      不解题，不转录文字，不解释。
    user_template: |
      planner 判断的图形类型：{{IMAGE_PRESENCE}}

      任务：
      在整张题图中找到解析、答案、解答、证明、讲解过程区域里的数学图形资产。

      坐标要求：
      1. 把整张输入图看成 1000 x 1000 的归一化画布。
      2. 左上角为 (0,0)，右下角为 (1000,1000)。
      3. 输出 image_width=1000，image_height=1000。

      必须识别：
      - 数轴、坐标轴、函数图像、几何图、辅助图、小草图、表格、统计图。
      - 特别注意细长数轴也是图形资产，不能因为很扁就忽略。

      必须排除：
      - 题干文字、纯公式推导、红色解析文字本身、页眉页脚、题号。

      如果找到细长数轴，请在该 bbox 的 review_flags 中加入 "number_line"。
      如果 bbox 可能贴边或略含文字，请在 review_flags 中加入 "bbox_needs_review"，不要漏图。

      Output schema:
      {
        "image_width": 1000,
        "image_height": 1000,
        "image_bboxes": [
          {
            "asset_id": "analysis_figure_001",
            "x": 0,
            "y": 0,
            "w": 0,
            "h": 0,
            "confidence": 0.0,
            "review_flags": []
          }
        ],
        "global_review_flags": []
      }
