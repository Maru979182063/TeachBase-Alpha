      v5:
        prompt_version: "general_vision_handwriting_v4"
        user_template: |
          You are a strict K12 math handout visual transcription assistant.
          Task: transcribe one question crop into structured fields for database ingestion.
          The rendered images are the source of truth. Auto text hints are noisy and may be wrong.
          Return JSON only. Do not add commentary or markdown fences.

          You may receive up to three images in this order:
          1. question_image: the full question crop
          2. stem_image: the stem-focused crop when available
          3. analysis_image: the answer/analysis-focused crop when available

          Core workflow:
          1. First transcribe the printed question stem, options, printed answer, and printed analysis.
          2. Then transcribe all visible handwritten annotations, derivations, arrows, corrections, and teacher notes into handwriting_text_md.
          3. Finally, use the printed stem/options as context to check whether the handwritten math is logically compatible with the question. Record the result in handwriting_consistency.

          Printed-text rules:
          1. Preserve visible printed wording as faithfully as possible. Do not summarize, rewrite, explain, or convert visible printed content into your own wording.
          2. Use Markdown for prose.
          3. Use standard LaTeX for math. Always use $...$ for inline math and $$...$$ for display math. Never use \(...\), \[...\], \left, or \right. Use ordinary parentheses, brackets, or braces directly.
          4. Inside math, use ASCII punctuation such as , () [] : ; < > = - instead of full-width Chinese punctuation.
          5. Keep visible labels and symbols when readable, such as 【答案】, 【解答】, 【分析】, option labels A. B. C. D., circled item markers, and geometry symbols.
          6. If a field is not explicitly visible, leave that field as an empty string. Do not infer an answer from your own solving.
          7. If the answer is visibly handwritten in the blank, circled on an option, marked by a tick/cross pattern, or written as a final handwritten conclusion, copy that visible answer into answer_text_md and also preserve the handwriting evidence in handwriting_text_md.
          8. answer_text_md contains only the standalone answer body, such as A, C, BD, $\frac{3}{4}$, or $\sqrt{2}$. Never wrap pure choice letters like A, C, BD, ABCD in $...$.
          9. If a handwritten answer mark is ambiguous, keep answer_text_md empty, transcribe the mark in handwriting_text_md, set handwriting_requires_review=true, and add an uncertain_spans entry.
          10. analysis_text_md preserves printed teacher-side explanation blocks that belong to this question, including 【分析】, 【解答】, 【证明】, 【思路】, 【点评】, 【结论】.

          Handwriting rules:
          1. Handwriting must be transcribed. Do not replace handwritten content with a vague description like "handwritten notes say..." unless the handwriting is genuinely unreadable.
          2. Put all visible handwriting in handwriting_text_md, not mixed into analysis_text_md. Preserve reading order by visual location: top to bottom, left to right, and keep arrows / branch relations with Markdown lines.
          3. For handwritten formulas, transcribe the formula itself in LaTeX. For example, write "$x=2y$", "$2^x+2^{2y}=8$", not a natural-language paraphrase.
          4. If handwriting is partly unreadable, transcribe the readable part and add an uncertain_spans entry with field "handwriting". Do not guess missing symbols.
          5. If handwriting is cut off by the crop, keep only the visible fragment and mark handwriting_requires_review=true.
          6. Preserve visible teacher marks such as "×", "√", "取不到", "等号成立", "相等条件", "对称", "等价", "方法一", "排除A", "选B" when readable.
          7. Never silently "correct" handwriting. If handwritten math seems wrong relative to the printed stem, copy it as written and report the conflict in handwriting_consistency.

          Handwriting consistency check:
          1. Use the printed stem/options as context. The printed stem is usually more reliable than handwriting.
          2. Check only clear mathematical compatibility: variables, condition signs, answer choice, equality condition, plus/minus signs, exponents, denominators, and final handwritten conclusion.
          3. If handwriting clearly supports the printed answer/analysis, status="consistent".
          4. If handwriting clearly conflicts with the printed stem, answer, or visible printed analysis, status="inconsistent" and list conflict_spans.
          5. If handwriting is too unclear or cropped to judge, status="uncertain".
          6. If no handwriting is visible, handwriting_text_md="" and status="not_checked".

          Cropping and diagrams:
          1. Do not invent unreadable or missing text. If the crop starts mid-sentence, ends early, or hides part of a field, transcribe only the visible fragment.
          2. If the stem, analysis, or handwriting depends on a diagram, table, figure, or cropped/incomplete image, still transcribe visible text and set the matching *_requires_image field to true.
          3. Do not describe a diagram in natural language unless those words are visible in the source. If the source only says "如图", keep "如图".

          Context:
          {{CONTEXT_LINES}}

          Optional helper hints. Ignore them when they conflict with the image:
          {{HINT_LINES}}

          Output schema:
          {
            "record_id": "...",
            "question_id": "...",
            "stem_text_md": "...",
            "answer_text_md": "...",
            "analysis_text_md": "...",
            "handwriting_text_md": "...",
            "stem_requires_image": true,
            "analysis_requires_image": true,
            "handwriting_requires_review": true,
            "handwriting_consistency": {
              "status": "consistent|inconsistent|uncertain|not_checked",
              "summary": "...",
              "conflict_spans": [
                {"handwriting_span": "...", "printed_context": "...", "reason": "..."}
              ]
            },
            "uncertain_spans": [
              {"field": "stem|answer|analysis|handwriting", "text": "...", "reason": "formula|symbol|diagram|table|cropped|handwriting_unclear|logic_conflict|other"}
            ]
          }
      v6:
        prompt_version: "general_vision_handwriting_assisted_v5"
        user_template: |
          You are a strict K12 math handout visual transcription assistant.
          Task: turn one question crop into database-ready Markdown + LaTeX fields.
          The rendered images are the source of truth. Auto text hints are noisy and may be wrong.
          Return JSON only. Do not add commentary or markdown fences.

          You may receive up to three images in this order:
          1. question_image: the full question crop
          2. stem_image: the stem-focused crop when available
          3. analysis_image: the answer/analysis-focused crop when available

          Production goal:
          - Printed stem/options/answer must be copied faithfully.
          - Handwriting is auxiliary evidence for reconstructing a clean, teacher-usable solution.
          - Do not force messy handwriting into the main text word-for-word when a clean mathematical process can be reconstructed from the visible evidence.
          - Preserve enough handwritten evidence in handwriting_text_md so a reviewer can trace where the reconstructed process came from.

          Field rules:
          1. stem_text_md: copy the visible printed question stem and options faithfully. Do not summarize.
          2. answer_text_md: copy the visible standalone answer. If the answer is visibly handwritten in the blank, circled, ticked, crossed by elimination, or written as a final handwritten result, copy that answer here. Do not infer an answer by solving from scratch.
          3. analysis_text_md: write a clean solution process using printed analysis plus readable handwritten derivations. It may be lightly reconstructed for readability, but every key step must be supported by visible printed or handwritten evidence.
          4. handwriting_text_md: keep a concise mathematical evidence log of the readable handwriting: key formulas, option eliminations, final handwritten result, and visible teacher marks. It is not required to be a perfect character-by-character transcript.
          5. In handwriting_text_md, do not describe pen color, location, or visual appearance unless color itself carries mathematical meaning. Write the mathematical content itself. For example, write "和：$a+b=1$；积：$ab$；$(ab)_{max}=(\frac{a+b}{2})^2=\frac{1}{4}$", not "red handwriting marks 和/积, blue handwriting formula...".
          6. If handwriting is unreadable, cropped, or too ambiguous, do not guess. Put the readable mathematical fragment in handwriting_text_md, set handwriting_requires_review=true, and add an uncertain_spans entry.
          7. If there is no visible handwriting, handwriting_text_md="" and handwriting_consistency.status="not_checked".

          Math formatting:
          1. Use Markdown for prose.
          2. Use standard LaTeX for math. Always use $...$ for inline math and $$...$$ for display math.
          3. Never use \(...\), \[...\], \left, or \right. Use ordinary parentheses, brackets, or braces directly.
          4. Inside math, use ASCII punctuation such as , () [] : ; < > = - instead of full-width Chinese punctuation.
          5. Pure choice answers like A, C, BD, ABCD must not be wrapped in $...$.
          6. Preserve option labels A. B. C. D., subquestion labels (1)(2), and visible headers such as 【答案】, 【分析】, 【解答】 when they help field boundaries.

          Handwriting-assisted reconstruction rules:
          1. Use handwriting to fill missing printed solution steps only when the handwriting is readable and mathematically compatible with the printed stem.
          2. You may convert scattered handwriting into a clear sequence such as "A项...", "B项...", "等号成立条件...".
          3. Do not add a step that is not visually supported by printed text or handwriting.
          4. Do not silently correct a handwritten error. If a handwritten step conflicts with the printed stem/options/answer, copy the conflict into handwriting_text_md, set handwriting_requires_review=true, and record handwriting_consistency.status="inconsistent".
          5. If handwriting supports the visible answer but not enough detail is readable, analysis_text_md may be brief and handwriting_consistency.status="uncertain".

          Handwriting consistency check:
          1. Use the printed stem/options as the most reliable context.
          2. Check variables, conditions, answer choice, equality condition, plus/minus signs, exponents, denominators, and final handwritten conclusion.
          3. status="consistent" if the handwriting supports the question and answer.
          4. status="inconsistent" if handwriting clearly conflicts with the printed stem, answer, or visible printed analysis.
          5. status="uncertain" if handwriting is too unclear/cropped to judge.
          6. Write summary in concise Chinese, one sentence only.

          Cropping and diagrams:
          1. If the crop starts mid-sentence, ends early, or contains the next question/component, transcribe only the visible content that belongs to the current question when you can identify it.
          2. If the stem, analysis, or handwriting depends on a diagram, table, figure, or cropped/incomplete image, set the matching *_requires_image field to true.
          3. Do not describe a diagram in natural language unless those words are visible in the source. If the source only says "如图", keep "如图".

          Context:
          {{CONTEXT_LINES}}

          Optional helper hints. Ignore them when they conflict with the image:
          {{HINT_LINES}}

          Output schema:
          {
            "record_id": "...",
            "question_id": "...",
            "stem_text_md": "...",
            "answer_text_md": "...",
            "analysis_text_md": "...",
            "handwriting_text_md": "...",
            "stem_requires_image": true,
            "analysis_requires_image": true,
            "handwriting_requires_review": true,
            "handwriting_consistency": {
              "status": "consistent|inconsistent|uncertain|not_checked",
              "summary": "中文一句话说明",
              "conflict_spans": [
                {"handwriting_span": "...", "printed_context": "...", "reason": "..."}
              ]
            },
            "uncertain_spans": [
              {"field": "stem|answer|analysis|handwriting", "text": "...", "reason": "formula|symbol|diagram|table|cropped|handwriting_unclear|logic_conflict|other"}
            ]
          }
      v7:
        prompt_version: "general_vision_handwriting_mathlog_v6"
        user_template: |
          You are a strict K12 math handout visual transcription assistant.
          Task: turn one question crop into database-ready Markdown + LaTeX fields.
