          - The final database fields must contain math content, not visual descriptions.
          - Handwriting is auxiliary mathematical evidence. Convert readable handwriting into clean math notes.
          - Do not write phrases describing appearance, color, location, or pen type.

          Field rules:
          1. stem_text_md: copy visible printed question stem and options faithfully.
          2. answer_text_md: copy the visible standalone answer. If the answer is visibly handwritten in the blank, circled/ticked on an option, or written as a final handwritten result, copy that answer here. Do not infer by solving from scratch.
          3. analysis_text_md: write a clean teacher-usable solution using printed analysis plus readable handwritten derivations. Every key step must be supported by visible evidence.
          4. handwriting_text_md: write only a concise mathematical note extracted from handwriting. Use forms like:
             - `和：$a+b=1$；积：$ab$`
             - `公式：$(ab)_{\max}=(\frac{a+b}{2})^2=\frac{1}{4}$`
             - `等号条件：$a=b=\frac{1}{2}$`
             - `排除A：$y=(x+1)^2+3$，最小值为3`
             - `答案：$\frac{1}{4}$`
          5. Forbidden in handwriting_text_md: do not use words such as 红色, 蓝色, 紫色, 黑色, 手写, 标注, 笔记, 空白处, 横线处, 顶部, 左侧, 右侧, 上方, 下方, 箭头, 可见, 图片, 颜色. If a visual mark means right/wrong, convert it to math meaning, e.g. `A项错误`, `C项可取到`.
          6. If handwriting is unreadable, cropped, or too ambiguous, do not guess. Put only readable mathematical fragments in handwriting_text_md, set handwriting_requires_review=true, and add an uncertain_spans entry.
          7. If there is no visible handwriting, handwriting_text_md="" and handwriting_consistency.status="not_checked".

          Math formatting:
          1. Use Markdown for prose.
          2. Use standard LaTeX for math. Always use $...$ for inline math and $$...$$ for display math.
          3. Never use \(...\), \[...\], \left, or \right. Use ordinary parentheses, brackets, or braces directly.
          4. Inside math, use ASCII punctuation such as , () [] : ; < > = - instead of full-width Chinese punctuation.
          5. Pure choice answers like A, C, BD, ABCD must not be wrapped in $...$.

          Handwriting-assisted reconstruction rules:
          1. Use handwriting to fill missing printed solution steps only when the handwriting is readable and compatible with the printed stem.
          2. You may convert scattered handwriting into a clean sequence such as "A项...", "B项...", "等号条件...".
          3. Do not add a step that is not visually supported by printed text or handwriting.
          4. Do not silently correct a handwritten error. If a handwritten step conflicts with the printed stem/options/answer, copy the mathematical conflict into handwriting_text_md, set handwriting_requires_review=true, and record handwriting_consistency.status="inconsistent".

          Handwriting consistency check:
          1. Use the printed stem/options as the most reliable context.
          2. Check variables, conditions, answer choice, equality condition, plus/minus signs, exponents, denominators, and final handwritten conclusion.
          3. status="consistent" if the handwriting supports the question and answer.
          4. status="inconsistent" if handwriting clearly conflicts with the printed stem, answer, or visible printed analysis.
          5. status="uncertain" if handwriting is too unclear/cropped to judge.
          6. Write summary in concise Chinese, one sentence only.

          Cropping and diagrams:
          1. If the crop starts mid-sentence, ends early, or contains the next question/component, transcribe only the visible content that belongs to the current question when you can identify it.
          2. If the stem, analysis, or handwriting depends on a diagram, table, figure, or cropped/incomplete image, set the matching *_requires_image field to true.
          3. Do not describe a diagram in natural language unless those words are visible in the source. If the source only says "如图", keep "如图".

          Context:
          {{CONTEXT_LINES}}

          Optional helper hints. Ignore them when they conflict with the image:
          {{HINT_LINES}}

          Output schema:
          {
            "record_id": "...",
            "question_id": "...",
            "stem_text_md": "...",
            "answer_text_md": "...",
            "analysis_text_md": "...",
            "handwriting_text_md": "...",
            "stem_requires_image": true,
            "analysis_requires_image": true,
            "handwriting_requires_review": true,
            "handwriting_consistency": {
              "status": "consistent|inconsistent|uncertain|not_checked",
              "summary": "中文一句话说明",
              "conflict_spans": [
                {"handwriting_span": "...", "printed_context": "...", "reason": "..."}
              ]
            },
            "uncertain_spans": [
              {"field": "stem|answer|analysis|handwriting", "text": "...", "reason": "formula|symbol|diagram|table|cropped|handwriting_unclear|logic_conflict|other"}
            ]
          }
  raw_blocks:
    prompt_version: "raw_blocks_v0.3"
    system_prompt: |
      You analyze one K12 math question crop from images.
      Your only job is literal visual transcription into ordered visible blocks.
      Do not solve the problem. Do not merge fields. Do not rewrite for readability.
      Return strict JSON only.
    user_template: |
      Task: transcribe the visible content into ordered blocks before any field mapping.

      You may receive up to three images in this order:
      1. question_image: the full question crop
      2. stem_image: the stem-focused crop when available
      3. analysis_image: the answer/analysis-focused crop when available

      Goal:
      1. Copy visible printed text and readable handwriting faithfully.
      2. Split the visible textual content into reading-order blocks.
      3. Keep each block local. Do not merge distant blocks into one final field.
      4. Role hints may be approximate. If unsure, use role_hint="unknown".

      Rules:
      1. Return strict JSON only.
      2. Use Markdown for prose and LaTeX for math.
      3. Use $...$ for inline math and $$...$$ for display math.
      4. Never use \(...\), \[...\], \left, or \right.
      5. Inside math, use ASCII punctuation such as , () [] : ; < > = -.
      5a. Transcribe comparison symbols as valid LaTeX: use \ne for not equal, \leq for less-than-or-equal, and \geq for greater-than-or-equal. Never output broken tokens such as e, eq, ae0, 1eq, leq0, or geq0 as plain text.
      5b. Transcribe set membership symbols as valid LaTeX: use \in and \notin. Never output broken fragments such as otin, otinM, noti, or inM as plain text.
      5c. For systems of equations, inequalities, piecewise layouts, or vertical vector coordinates, preserve the two-dimensional layout with $$...$$ and cases/aligned/pmatrix/bmatrix when visible.
      6. Do not summarize, explain, solve, normalize wording, or improve formatting beyond faithful readable transcription.
      7. visible_blocks must contain only visible text blocks. Do not create a block that merely describes a figure, graph, geometry diagram, or layout.
      8. If an image region has no readable text, omit it from visible_blocks and rely on *_requires_image flags instead.
      9. Merge consecutive lines that belong to the same paragraph or same subquestion into one block. Prefer paragraph-level blocks, not line-level blocks.
      10. Target a compact block list, usually 8 to 16 blocks for one question. Do not create dozens of tiny blocks.
      11. Keep internal newlines inside content_md when needed instead of splitting into another block.
      12. If a block is partly cropped, keep the visible fragment only.
      13. Keep visible headers like 【答案】, 【分析】, 【解答】, 【证明】 if they are actually visible.
      14. Handwriting must be kept as handwriting blocks when readable. Do not rewrite handwriting into polished final analysis here.
      15. If a diagram is the main evidence and text is insufficient, still copy visible text and set the matching *_requires_image flag.

      Context:
      {{CONTEXT_LINES}}

      Optional helper hints. Ignore them when they conflict with the image:
      {{HINT_LINES}}

      Output schema:
      {
        "record_id": "...",
        "question_id": "...",
        "visible_blocks": [
          {
            "block_id": "b1",
            "order": 1,
            "block_type": "printed|handwriting",
            "role_hint": "stem|answer|analysis|option|unknown",
            "content_md": "..."
          }
        ],
        "stem_requires_image": true,
        "analysis_requires_image": true,
        "handwriting_requires_review": true,
        "uncertain_spans": [
          {"field": "visible_blocks", "text": "...", "reason": "formula|symbol|diagram|table|cropped|handwriting_unclear|other"}
        ]
      }
  field_mapping:
    prompt_version: "field_mapping_v0.2"
    system_prompt: |
      You map already-transcribed visible blocks into final database fields for one K12 math question.
      Your job is field assignment and clean composition only.
      Do not invent new content. Do not solve from scratch. Return strict JSON only.
    user_template: |
      Task: map the provided visible blocks into final database fields.

      You may receive up to three images in this order:
      1. question_image: the full question crop
      2. stem_image: the stem-focused crop when available
      3. analysis_image: the answer/analysis-focused crop when available

      Input visible blocks JSON:
      {{RAW_BLOCKS_JSON}}

      Rules:
      1. Use the visible blocks as the primary textual source. Use the images only to resolve field ownership and obvious grouping.
      2. Do not invent missing text that is absent from both the blocks and the image.
      3. stem_text_md must contain the question stem and visible options that belong to the stem.
      4. answer_text_md must contain only the standalone visible answer body. If there is no standalone visible answer, keep it empty.
      5. analysis_text_md must contain visible explanation / proof / analysis blocks in reading order.
      6. handwriting_text_md must contain concise math evidence from handwriting only. Do not describe colors or positions.
      7. If a handwritten final answer is visibly present, it may populate answer_text_md and also remain evidenced in handwriting_text_md.
      8. Preserve Markdown + LaTeX. Use $...$ and $$...$$ only.
      9. Pure choice answers like A, C, BD, ABCD must not be wrapped in $...$.
      9a. Preserve comparison symbols as valid LaTeX: use \ne, \leq, and \geq. If the visible expression says 9 is not equal to 10, output $9 \ne 10$, not 9e10 or 9eq10. If it says a is not equal to 0, output $a \ne 0$, not ae0.
      9b. Preserve set membership symbols as valid LaTeX: output $4 \notin M$, not 4otinM; output $2 \in M$, not 2inM.
      9c. Preserve equation-system and vector-coordinate layout. If the visible math has a large brace with multiple lines, compose it as \begin{cases} ... \\ ... \end{cases}; if it is a column vector, use pmatrix or bmatrix.
      10. Standalone figure captions or bare figure labels such as `图1`, `图2`, `图3` must not be inserted into stem_text_md or analysis_text_md unless they are part of a visible sentence.
      11. If images are still required for safe use, set the matching *_requires_image field to true.
      12. If handwriting is unclear or conflicts with the printed content, keep the readable fragment in handwriting_text_md, set handwriting_requires_review=true, and fill handwriting_consistency.

      Context:
      {{CONTEXT_LINES}}

      Optional helper hints. Ignore them when they conflict with the image:
      {{HINT_LINES}}

      Output schema:
      {
        "record_id": "...",
        "question_id": "...",
        "stem_text_md": "...",
        "answer_text_md": "...",
        "analysis_text_md": "...",
        "handwriting_text_md": "...",
        "stem_requires_image": true,
        "analysis_requires_image": true,
        "handwriting_requires_review": true,
        "handwriting_consistency": {
          "status": "consistent|inconsistent|uncertain|not_checked",
          "summary": "中文一句话说明",
          "conflict_spans": [
            {"handwriting_span": "...", "printed_context": "...", "reason": "..."}
          ]
        },
        "uncertain_spans": [
          {"field": "stem|answer|analysis|handwriting", "text": "...", "reason": "formula|symbol|diagram|table|cropped|handwriting_unclear|logic_conflict|other"}
        ]
      }
  refine:
    prompt_version: "local_refine_v0.1"
    user_template: |
      You are a K12 math visual refinement assistant.
      Task: review only the risky spans listed below against the provided images and correct them if the image evidence clearly supports a correction.
      Keep all other text unchanged. Do not rewrite for style. Do not summarize. Do not expand "如图" into a natural-language picture description.
      If the image is cropped or unclear, keep the current text and add an unresolved span instead of guessing.
      Return JSON only.

      Rules:
      1. Only change text when the image evidence is clear.
      2. Preserve existing field boundaries: stem_text_md / answer_text_md / analysis_text_md.
      3. Preserve Markdown + LaTeX. Use $...$ and $$...$$ only.
      4. Never drop visible object labels such as A, B, C, D, E, F, G, M, N, P, Q, point names, line names, or angle labels.
      5. If no correction is needed, return the original fields unchanged and an empty refine_log.
      6. If you change a span, log it in refine_log with field, span_before, span_after, reason, evidence_ref_key, and confidence.
      7. If a listed span remains unclear, record it in unresolved_spans.

      record_id: {{RECORD_ID}}
      question_id: {{QUESTION_ID}}

      Current fields:
      stem_text_md = {{STEM_TEXT_JSON}}
      answer_text_md = {{ANSWER_TEXT_JSON}}
      analysis_text_md = {{ANALYSIS_TEXT_JSON}}

      Risk spans to inspect:
      {{RISK_SPANS_BLOCK}}

      Output schema:
      {
        "record_id": "...",
        "question_id": "...",
        "stem_text_md": "...",
        "answer_text_md": "...",
        "analysis_text_md": "...",
        "stem_requires_image": true,
        "analysis_requires_image": true,
        "uncertain_spans": [],
        "refine_log": [
          {"field":"stem|answer|analysis","span_before":"...","span_after":"...","reason":"local_reread","evidence_ref_key":"question_image|stem_image|analysis_image","confidence":0.0}
        ],
        "unresolved_spans": [
          {"field":"stem|answer|analysis","text":"...","reason":"unclear_after_reread"}
        ]
      }
  option_anchor:
    prompt_version: "option_anchor_v1.2"
    system_prompt: |
      You analyze Chinese K12 math question layout from images.
      You only do visual structure analysis and must return strict JSON.
      Do not solve the question. Do not transcribe full fields. Do not add commentary.
    user_template: |
      Task: detect multiple-choice option anchors and image ownership inside one question image.

      Goal:
      1. Detect the stem region.
      2. Detect option anchors A/B/C/D when they exist.
      3. Detect each option's full visual region.
      4. Detect image regions inside each option.
      5. Detect public stem images that belong to the question stem, not to a single option.
      6. Detect image regions that cannot be assigned confidently.
      7. Distinguish true figure objects from text strips, formula strips, and decorative text.

      Coordinate rules:
      1. Do not output real pixel coordinates.
      2. Treat the whole input image as a normalized 1000 x 1000 canvas.
      3. Top-left is (0, 0), bottom-right is (1000, 1000).
      4. In the output, image_width must be 1000 and image_height must be 1000.
      5. All x, y, w, h values must use this normalized 0-1000 coordinate system.

      Rules:
      1. Return strict JSON only.
      2. Use normalized coordinates with keys x, y, w, h.
      3. Use bbox_space={{BBOX_SPACE}} for all option and stem image boxes unless the image clearly belongs to another provided crop.
      4. If an option contains only text, image_bboxes must be an empty array.
      5. If an image belongs to the public stem instead of a single option, put it into stem_image_bboxes.
      6. If an image cannot be assigned confidently, put it into unassigned_image_bboxes.
      7. If confidence is below 0.75, add review_flags such as option_anchor_low_confidence or cross_option_image_detected.
      8. Do not include analysis-region images inside option image_bboxes.
      9. If no reliable options are visible, return an empty options array and put option_anchor_missing in global_review_flags.
      10. A true image region means a self-contained visual object such as a coordinate graph, geometry diagram, shaded construction figure, table, or chart. It is not just any non-text patch.
      11. Do not mark these as images: a short formula line, a title strip, a red explanation line, a page number, a figure caption line, an option label, or a thin horizontal text band.
      12. If a region is mostly text with only a tiny symbol, arrow, or underline, do not return it as an image bbox.
      13. Return tight boxes around the graphical object itself. Do not swallow nearby paragraphs, question sentences, or large blank margins.
      14. If one figure contains axes, curves, point labels, or geometric point names, keep them together in one box.
      15. If multiple figures are clearly separate, such as 图1 / 图2 / 图3 or several side-by-side diagrams, return separate boxes instead of one merged box.
      16. If you are unsure whether a region is a true figure or only stylized text, prefer not to return that box.

      Optional noisy text hint:
      {{HINT_TEXT}}

      Output schema:
      {
        "image_width": 0,
        "image_height": 0,
        "stem_bbox": {"x": 0, "y": 0, "w": 0, "h": 0},
        "options": [
          {
            "option_key": "A",
            "option_order": 1,
            "label_bbox": {"x": 0, "y": 0, "w": 0, "h": 0},
            "option_bbox": {"x": 0, "y": 0, "w": 0, "h": 0},
            "text_bbox": {"x": 0, "y": 0, "w": 0, "h": 0},
            "image_bboxes": [],
            "layout_type": "vertical|horizontal|two_column|unknown",
            "confidence": 0.0,
            "review_flags": []
          }
        ],
        "stem_image_bboxes": [],
        "unassigned_image_bboxes": [],
        "global_review_flags": []
      }
  inline_figure:
    prompt_version: "inline_figure_cn_grounding1000_v1.5"
    system_prompt: |
      你只做一件事：从一张中文数学题图片中找出需要单独保存的图形资产本体。
      只返回严格 JSON，不解题，不转录文字，不解释。
    user_template: |
      任务：找出图片中的“图形资产本体”，并给出每张图的 bbox。

      图片类型：{{BBOX_SPACE}}
      原图真实尺寸：width={{IMAGE_WIDTH}}, height={{IMAGE_HEIGHT}}

      坐标要求：
      1. 不要输出原图像素坐标。
      2. 请把整张图片看成一个 1000 × 1000 的归一化坐标画布。
      3. 左上角是 (0, 0)，右下角是 (1000, 1000)。
      4. 输出里的 image_width 必须是 1000，image_height 必须是 1000。
      5. x、y、w、h 全部使用这个 0-1000 坐标系。

      什么算图形资产本体：
      - 函数图像、坐标系、几何图、立体图、统计图、表格、示意图。
      - 图内部或紧贴图形的 x、y、O、A、B、C、D、点名、坐标轴箭头、曲线端点、几何顶点，都属于图形资产，必须保留。

      什么不属于图形资产：
      - 选项编号 A. B. C. D. 只是定位锚点，不能框进去。
      - 题干文字、解析文字、红色讲解文字、公式行、页眉页脚、标题条，不能框进去。

      框选原则：
      1. 每个独立图形资产输出一个 bbox。
      2. bbox 只框图形主体和图内必要标签，不要框整个选项区域。
      3. 先看黑/灰色图形线条主体，再包含图内标签，最后留少量安全边距。
      4. 不能裁掉坐标轴箭头、曲线端点、几何顶点、图内标签。
      5. 如果图形和外部文字距离很近，宁可略微裁紧，也不要吞入题干或解析文字。
      6. 如果无法干净分离但必须保证完整，在 review_flags 加 bbox_may_include_text。
      7. 如果疑似裁残，在 review_flags 加 bbox_may_clip_figure。

      Optional noisy text hint:
      {{HINT_TEXT}}

      Output schema:
      {
        "image_width": 1000,
        "image_height": 1000,
        "image_bboxes": [
          {
            "asset_id": "figure_001",
            "x": 0,
            "y": 0,
            "w": 0,
            "h": 0,
            "confidence": 0.0,
            "review_flags": []
          }
        ],
        "global_review_flags": []
      }
  inline_figure_refine:
    prompt_version: "inline_figure_refine_cn_grounding1000_v0.1"
    system_prompt: |
      你只做数学题内配图的二次精切。
      输入是一张候选小裁片，里面可能包含真正的函数图、几何图、统计图，也可能混入题干文字、红色解析、选项编号、页眉页脚。
      只返回严格 JSON，不解题，不转录题目，不解释。
    user_template: |
      任务：判断这张候选裁片里是否存在“需要单独保存的数学图形本体”，并给出精切 bbox。

      坐标要求：
      1. 把当前候选裁片看成 1000 x 1000 的归一化画布。
      2. 左上角是 (0,0)，右下角是 (1000,1000)。
      3. 输出 image_width=1000，image_height=1000。
      4. bbox 只针对当前候选裁片，不是原始整题图。

      什么必须保留：
      - 坐标轴、箭头、曲线、几何线段、辅助线、点名、图内字母、图内坐标、图1/图2/图3这类紧贴图形的图注。

      什么必须去掉：
      - 题干文字、解析文字、红色讲解文字、公式推导行、选项编号 A/B/C/D、蓝色页眉、页码、空白边。

      判断规则：
      1. 如果候选裁片主要是文字/公式/解析，不是图形，返回 is_valid_figure=false。
      2. 如果确实有图形，但边上混了文字，返回只框图形本体的新 bbox。
      3. 宁可略微贴紧，也不要把大段题干或解析文字框进去。
      4. 不要裁掉坐标轴箭头、几何顶点、曲线端点、点名标签。

      Output schema:
      {
        "image_width": 1000,
        "image_height": 1000,
        "is_valid_figure": true,
        "bbox": {"x": 0, "y": 0, "w": 0, "h": 0},
        "confidence": 0.0,
        "review_flags": []
      }
