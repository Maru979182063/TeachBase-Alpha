          1. Preserve visible wording as faithfully as possible. Do not summarize, rewrite, explain, or convert visible content into your own wording.
          2. Use Markdown for prose.
          3. Use standard LaTeX for math. Always use $...$ for inline math and $$...$$ for display math. Never use \(...\) or \[...\].
          4. Inside math, use ASCII punctuation such as , () [] : ; < > = - instead of full-width Chinese punctuation.
          5. Keep special visible labels and symbols when they are readable, such as example headers, analysis headers, answer headers, proof headers, circled item markers, and option labels like A. B. C. D.
