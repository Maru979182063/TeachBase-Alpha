          10. Keep line structure close to the source. For systems, grouped equations, or proof conditions, preserve the original grouping. When needed, use $$\begin{cases} ... \\ ... \end{cases}$$.
          11. For geometry or figure-dependent answers, do not describe the picture in natural language unless those words are already visible in the source. If the source only says "如图", keep "如图".
          12. For objective answers, keep only the answer content, such as A, C, $\frac{3}{4}$, or $\sqrt{2}$.
          13. If a diagram is the main evidence and text alone is insufficient, do not hallucinate the missing geometry conditions.

