schema_version: docx_native_pipeline_config.v0.1

pipeline:
  output_root: outputs/docx_native_pipeline_v0_1
  default_run_id_prefix: docx_native
  stop_preview_server_port: 8765

runtime_contract:
  track_code: math_junior
  subject: math
  stage: junior
  grade: g8
  season: summer
  question_visual_structure_schema: question_visual_structure.v1.1

model_refine:
  enabled: true
  provider: volcengine_ark
  endpoint: https://ark.cn-beijing.volces.com/api/v3/chat/completions
  model_alias: doubao2.0mini
  model: doubao-seed-2-0-lite-260428
  api_key_env: ARK_API_KEY
  temperature: 0.1
  max_tokens: 4096
  timeout_seconds: 120
  retry_count: 2

isolation:
  owned_output_roots:
    - outputs/docx_native_pipeline_v0_1
    - outputs/docx_native_ingest_v0_1
  owned_tool_prefixes:
    - tools/docx_native_
  forbidden_write_roots:
    - outputs/visual_split
    - outputs/teacher_handout_visual_split
    - config/teacher_handout_visual_prompts.yaml

release_policy:
  refined_condition_group_status: ready_for_runtime_dry_run
  no_runtime_import_by_default: true
  no_database_write_by_default: true
