name: G5 Canonical Content Import

on:
  push:
    branches:
      - "backend/g5-canonical-content-import-recovery"
  pull_request:
    branches:
      - "integration/repository-scope-clean-20260715"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g5-canonical-import-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  g5-gate:
    name: G5 gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # final-chain foundation 会核对基线与固定 inventory commit，浅克隆无法完成历史差异门禁。
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Set up Temurin 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Python package
        run: python -m pip install -e ".[dev]"

      - name: Install Node dependencies
        run: npm ci

      # Windows runner 的 PostgreSQL 由服务账号承载，避免管理员进程直接启动数据库。
      - name: Start isolated PostgreSQL service on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $service = Get-Service -Name "postgresql*" | Select-Object -First 1
          if (-not $service) { throw "postgresql_service_not_found" }
          Set-Service -Name $service.Name -StartupType Manual
          Start-Service -Name $service.Name
          $service.WaitForStatus("Running", [TimeSpan]::FromMinutes(2))
          $testRoot = Join-Path $env:RUNNER_TEMP "g5-runtime-tests"
          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
          "RUNTIME_TEST_POSTGRES_ADMIN_URL=postgresql://postgres:root@127.0.0.1:5432/postgres" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RUNTIME_TEST_TEMP_ROOT=$testRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # 与 npm run test:g5-canonical-import 保持同一顺序，但拆成命名步骤，
      # 让双平台失败能直接落到具体合同，而不是只留下一个聚合 exit code。
      - name: Check Java Chinese comments
        run: npm run test:java-comment-contract

      - name: Run V010 migration gate
        run: npm run test:g5-v010-migration

      - name: Build Java foundation
        run: npm run build:java-foundation

      - name: Run final-chain foundation integration gate
        run: npm run test:final-chain-foundation-integration

      - name: Run G5 canonical import live gate
        run: npm run test:g5-import-live

      - name: Run complete G4 regression gate
        run: npm run test:g4-handout-foundation

      - name: Check active absolute paths
        run: npm run test:active-absolute-paths

      - name: Check G5 workflow contract
        run: npm run test:g5-workflow-contract

      - name: Build G5 acceptance evidence
        run: python tools/build_g5_acceptance_evidence.py

      - name: Upload G5 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: g5-canonical-import-evidence-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            docs/reports/g5_v010_migration_gate.json
            docs/reports/g5_canonical_import_live_gate.json
            docs/reports/g5_canonical_import_acceptance_evidence.json
            docs/reports/g5_canonical_import_acceptance_report.md
            backend/teachbase-server/target/surefire-reports/
