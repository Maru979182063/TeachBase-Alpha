name: G4 Handout Content Foundation

on:
  push:
    branches:
      - "backend/g4-handout-content-asset-foundation"
  pull_request:
    branches:
      - "integration/repository-scope-clean-20260715"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g4-handout-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  g4-gate:
    name: G4 gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Set up Temurin 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install Node dependencies
        run: npm ci

      - name: Start isolated PostgreSQL service on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $service = Get-Service -Name "postgresql*" | Select-Object -First 1
          if (-not $service) { throw "postgresql_service_not_found" }
          Set-Service -Name $service.Name -StartupType Manual
          Start-Service -Name $service.Name
          $service.WaitForStatus("Running", [TimeSpan]::FromMinutes(2))
          $testRoot = Join-Path $env:RUNNER_TEMP "g4-runtime-tests"
          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
          "RUNTIME_TEST_POSTGRES_ADMIN_URL=postgresql://postgres:root@127.0.0.1:5432/postgres" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RUNTIME_TEST_TEMP_ROOT=$testRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run complete G4 gate
        run: npm run test:g4-handout-foundation

      - name: Upload G4 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: g4-handout-evidence-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            docs/reports/g4_v009_migration_gate.json
            docs/reports/g4_handout_foundation_live_gate.json
            docs/reports/wp01_editor_working_draft_gate_20260902.json
            docs/reports/editor_backend_live_gate_20260831.json
            docs/reports/question_governance_live_gate_20260901.json
            docs/reports/release_seed_loader_live_gate_20260901.json
            docs/reports/document_renderer_live_gate_20260831.json
            backend/teachbase-server/target/surefire-reports/
